<!DOCTYPE html>
<html lang="zh" data-tp-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
  <title>tPlanner — 随手记</title>
  <link rel="stylesheet" href="./tplanner-light.css">
  <link rel="stylesheet" href="./shared-widget.css">
  <link rel="stylesheet" href="./notes-widget.css">
</head>
<body>
<div id="app">
  <header>
    <div class="hdr-title">随手记</div>
    <div class="hdr-right">
      <button class="icon-btn" id="btn-pin" title="始终置顶" aria-label="始终置顶" aria-pressed="false">↴</button>
      <button class="icon-btn" id="btn-open" title="打开 tPlanner" aria-label="打开 tPlanner">↗</button>
      <button class="icon-btn danger" id="btn-close" title="关闭" aria-label="关闭随手记">✕</button>
    </div>
  </header>
  <main>
    <div id="notes-editor" contenteditable="true" role="textbox" aria-label="今日随手记"
         aria-multiline="true" aria-describedby="mode-hint" spellcheck="false"
         data-placeholder="记录今天的想法、灵感…"></div>
  </main>
  <footer>
    <span id="mode-hint">点击编辑</span>
    <span id="save-indicator" role="status" aria-live="polite"></span>
  </footer>
</div>
<script src="./marked.umd.js"></script>
<script type="module" src="./notes-widget.js"></script>
</body>
</html>
