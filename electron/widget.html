<!DOCTYPE html>
<html lang="zh" data-tp-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
  <title>tPlanner — 今日</title>
  <link rel="stylesheet" href="./tplanner-light.css">
  <link rel="stylesheet" href="./shared-widget.css">
  <link rel="stylesheet" href="./widget.css">
</head>
<body>
<div id="app">
  <header>
    <div class="hdr-left">
      <div class="hdr-date" id="hdr-date">今日</div>
      <div class="hdr-sub" id="hdr-sub">今日事件</div>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" id="btn-pin" title="始终置顶" aria-label="始终置顶" aria-pressed="false">↴</button>
      <button class="icon-btn" id="btn-open" title="打开 tPlanner" aria-label="打开 tPlanner">↗</button>
      <button class="icon-btn danger" id="btn-close" title="关闭便签" aria-label="关闭便签">✕</button>
    </div>
  </header>
  <main id="list" aria-label="今日安排">
    <div class="empty" role="status">
      <div class="empty-icon spin" aria-hidden="true">↻</div>
      <div class="empty-text">加载中…</div>
    </div>
  </main>
  <footer>
    <div class="stats" id="stats"><span>--</span></div>
    <div class="actions"><button class="link-btn" id="btn-refresh">↻ 刷新</button></div>
  </footer>
</div>
<script type="module" src="./widget.js"></script>
</body>
</html>
